name: linux

on:
  # Not on every push: see checks.yml (private repo, paid minutes ran out).
  pull_request:
  workflow_dispatch:
  release:
    types: [published]   # builds the release's AppImage and attaches it (job "release")

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: System libraries (PortAudio, Qt, Chromium for the radio globe, Xvfb)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libportaudio2 libsndfile1 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libglib2.0-0t64 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxkbfile1 libasound2t64 libxcb-cursor0 ffmpeg \
            libxcb-icccm4 libxcb-keysyms1 \
            xvfb xkb-data x11-xkb-utils dbus  # Xvfb's keymap: hotkey tests; dbus: portal tests
      - run: pip install -r requirements-linux.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
          # Ubuntu 24.04's AppArmor stops Chromium's sandbox in CI; the tests' pages are local
          QTWEBENGINE_DISABLE_SANDBOX: "1"

  appimage:
    # built on the oldest Ubuntu we support: the AppImage needs its glibc or newer
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: System libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libportaudio2 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libglib2.0-0 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libasound2 libxcb-cursor0 file \
            libpulse0 pulseaudio-utils libsndfile1 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1 \
            build-essential libasound2-dev   # PortAudio, built without JACK
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-linux.txt -r requirements-dev.txt
      - name: appimagetool
        run: |
          curl -sSfL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: Build (PyInstaller, self-test, AppImage)
        env:
          APPIMAGETOOL: ./appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"   # no FUSE on the runner
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: ./build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OnionBoard-x86_64.AppImage
          path: dist/OnionBoard-x86_64.AppImage
          retention-days: 14

  release:
    # the Linux self-update and the download links look for exactly this file name
    if: github.event_name == 'release'
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OnionBoard-x86_64.AppImage
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # and a copy for Update now (soundboard/linux/updates.py UPDATE_ASSET), so the
        # download counts tell updates apart from new downloads, as on Windows
        run: |
          cp OnionBoard-x86_64.AppImage OnionBoard-x86_64-update.AppImage
          gh release upload "$TAG" OnionBoard-x86_64.AppImage             OnionBoard-x86_64-update.AppImage --clobber -R "$GITHUB_REPOSITORY"
