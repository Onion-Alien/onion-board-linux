name: linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: System libraries (PortAudio, Qt, Chromium for the radio globe, Xvfb)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libportaudio2 libsndfile1 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libglib2.0-0t64 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxkbfile1 libasound2t64 libxcb-cursor0 ffmpeg \
            xvfb xkb-data x11-xkb-utils   # Xvfb needs its keymap for the hotkey tests
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
          # Ubuntu 24.04's AppArmor stops Chromium's sandbox in CI; the tests' pages are local
          QTWEBENGINE_DISABLE_SANDBOX: "1"

  appimage:
    # built on the oldest Ubuntu we support: the AppImage needs its glibc or newer
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: System libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libportaudio2 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libglib2.0-0 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libasound2 libxcb-cursor0 file \
            libpulse0 libsndfile1 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1   # bundled into the AppImage
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
      - name: appimagetool
        run: |
          curl -sSfL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: Build (PyInstaller, self-test, AppImage)
        env:
          APPIMAGETOOL: ./appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"   # no FUSE on the runner
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: ./build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OnionBoard-x86_64.AppImage
          path: dist/OnionBoard-x86_64.AppImage
          retention-days: 14
